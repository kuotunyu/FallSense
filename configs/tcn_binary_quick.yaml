evaluation:
  random_state: 20260719
  inner_folds: 2
  calibration: sigmoid
model:
  hidden_channels: 8
  levels: 2
  kernel_size: 3
  dropout: 0.0
  learning_rate: 0.001
  weight_decay: 0.0001
  epochs: 1
  batch_size: 128
  device: cuda
  deterministic: true
protocol:
  architecture: causal_tcn
  input: raw_window
  normalization: per_channel_train_fold_only
  missing_channels: explicit_mask_before_channel_mixing
  imbalance: bce_pos_weight_train_fold_only
  early_stopping: disabled_fixed_epochs
runtime:
  torch: 2.11.0+cu128
  install_index: https://download.pytorch.org/whl/cu128
