name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.18"
          enable-cache: true
      - name: 安裝 Python 3.10
        run: uv python install 3.10
      - name: 建立環境
        run: uv sync --python 3.10 --frozen --extra dev --extra download --extra plot
      - name: 防止資料與大檔入庫
        run: uv run python scripts/check_repo_guard.py
      - name: Ruff
        run: uv run ruff check .
      - name: Mypy
        run: uv run mypy
      - name: Pytest
        run: uv run pytest --cov=fallsense --cov-report=term-missing
